<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRMSU Campus Explorer</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body>
<div class="container mt-4"><h2>Department Directory</h2><div class="row g-2 my-3"><div class="col-md-8"><input id="q" class="form-control" placeholder="Search..."></div><div class="col-md-4"><select id="c" class="form-select"><option value="0">All categories</option></select></div></div><div class="row g-4" id="l"></div></div>
<script type="module">import {sb,layout,card,esc,SEL} from './js/common.js';layout();
const {data:cats}=await sb.from('categories').select('*').order('id');c.insertAdjacentHTML('beforeend',(cats||[]).map(x=>'<option value="'+x.id+'">'+esc(x.category_name)+'</option>').join(''));
const {data}=await sb.from('departments').select(SEL).order('department_name');q.value=new URLSearchParams(location.search).get('q')||'';
function r(){const s=q.value.toLowerCase(),k=+c.value;const o=(data||[]).filter(d=>(!k||d.category_id===k)&&(d.department_name+(d.buildings?.building_name||'')).toLowerCase().includes(s));l.innerHTML=o.map(card).join('')||'<p>No results.</p>'}
q.oninput=c.onchange=r;r();</script></body></html>
