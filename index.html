<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRMSU Campus Explorer</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body>
<section class="hero text-center"><div class="container"><h1 class="display-4 fw-bold">Explore PRMSU</h1><p class="lead">Find colleges, offices and facilities, and get directions across campus.</p>
<form action="departments.html" class="row justify-content-center g-2 mb-3"><div class="col-md-5"><input name="q" class="form-control form-control-lg" placeholder="Search department or building"></div></form>
<a href="map.html" class="btn btn-gold btn-lg"><i class="fa-solid fa-map-location-dot"></i> Explore Campus</a></div></section>
<div class="container mt-5"><h2 class="mb-4">Featured Departments</h2><div class="row g-4" id="f"></div></div>
<script type="module">import {sb,layout,card,SEL} from './js/common.js';layout();
const {data}=await sb.from('departments').select(SEL).order('created_at',{ascending:false}).limit(6);f.innerHTML=(data||[]).map(card).join('')||'<p>No departments yet.</p>';</script></body></html>
