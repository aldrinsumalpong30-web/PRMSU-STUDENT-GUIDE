<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRMSU Campus Explorer</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body>
<div class="container mt-4" id="d">Loading...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script type="module">import {sb,layout,esc,img,dir,CFG} from './js/common.js';layout();
const slug=new URLSearchParams(location.search).get('slug');
const {data:x}=await sb.from('departments').select('*,categories(category_name),buildings(building_name,latitude,longitude),department_images(image_path)').eq('slug',slug||'').maybeSingle();
if(!x)d.innerHTML='<h3>Department not found.</h3>';else{const b=x.buildings;document.title=x.department_name;
d.innerHTML='<nav class="small"><a href="index.html">Home</a> / <a href="departments.html">Directory</a> / '+esc(x.department_name)+'</nav><h2 class="mt-2">'+esc(x.department_name)+'</h2><span class="badge bg-primary">'+esc(x.categories?.category_name)+'</span><div class="row mt-3 g-4"><div class="col-md-7"><img class="img-fluid rounded mb-3" src="'+img(x.image)+'"><div class="row g-2">'+x.department_images.map(i=>'<div class="col-4"><img class="img-fluid rounded" src="'+esc(i.image_path)+'"></div>').join('')+'</div><p class="mt-3" style="white-space:pre-line">'+esc(x.description)+'</p>'+(x.programs?'<h5>Programs / Services</h5><ul>'+x.programs.split(/\r?\n/).filter(s=>s.trim()).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'')+((x.contact_email||x.contact_number)?'<p>'+esc(x.contact_email)+' &nbsp; '+esc(x.contact_number)+'</p>':'')+'</div><div class="col-md-5"><p><b>Building:</b> '+esc(b?.building_name||'N/A')+'</p>'+(b?'<div id="mini" style="height:300px" class="rounded"></div>'+'<a class="btn btn-gold mt-3" target="_blank" rel="noopener" href="'+dir(b.latitude,b.longitude)+'">Get Directions</a> <a class="btn btn-outline-primary mt-3" href="map.html?dept='+encodeURIComponent(x.slug)+'">View on Map</a>':'')+'</div></div>';if(b){const m=L.map('mini').setView([b.latitude,b.longitude],17);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);L.circleMarker([b.latitude,b.longitude],{radius:9,fillColor:'#0b2d6b',fillOpacity:1,color:'#fff',weight:2}).addTo(m)}}</script></body></html>
